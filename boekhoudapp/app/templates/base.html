<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}Boekhouding{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <nav class="zijbalk">
    <div class="logo">boekhouding<span>.</span></div>
    <a href="/" class="{{ 'actief' if actief == 'dashboard' }}">Dashboard</a>
    <a href="/relaties" class="{{ 'actief' if actief == 'relaties' }}">Relaties</a>
    <a href="/facturen" class="{{ 'actief' if actief == 'facturen' }}">Facturen</a>
    <a href="/producten" class="{{ 'actief' if actief == 'producten' }}">Producten</a>
    <a href="/mutaties" class="{{ 'actief' if actief == 'mutaties' }}">Mutaties</a>
    <a href="/winst-en-verlies" class="{{ 'actief' if actief == 'winst-en-verlies' }}">Winst &amp; verlies</a>
    <a href="/instellingen" class="{{ 'actief' if actief == 'instellingen' }}">Instellingen</a>
  </nav>
  <main class="inhoud">
    {% block inhoud %}{% endblock %}
  </main>
</div>
</body>
</html>
